[project]
name = "modern-hy"
version = "0.1.0"
description = "Modern Hy 1.3 language features: chained setv, setx, match, annotations, deftype, t-strings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hy>=1.3.1",
    "pytest>=9.2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
]

[tool.uv]
exclude-newer = "2 days"
