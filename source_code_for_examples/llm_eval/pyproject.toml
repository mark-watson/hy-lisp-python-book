[project]
name = "llm-eval"
version = "0.1.0"
description = "hy-eval: a tiny evaluation, tracing, and guardrails toolkit for LLM applications, written in Hy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hy>=1.3.1",
    "pydantic>=2.11",
    "pytest>=9.2.0",
]

[tool.uv]
exclude-newer = "2 days"
