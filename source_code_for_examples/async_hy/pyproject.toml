[project]
name = "async-hy"
version = "0.1.0"
description = "Async and concurrent Hy: asyncio, TaskGroup, httpx, streaming LLM output, queues, executors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hy>=1.3.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
]

[tool.uv]
exclude-newer = "2 days"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
