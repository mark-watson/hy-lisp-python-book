[project]
name = "google-gemini"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.31.0",
    "hy>=1.3.1",
    "pytest>=9.2.0",
    "requests>=2.32.4",
]

[tool.uv]
exclude-newer = "2 days"

[tool.pytest.ini_options]
# google-genai triggers a harmless SyntaxWarning on import
filterwarnings = ["ignore::SyntaxWarning"]
